# Nginx 配置文件 - mcp.yunwan.me
# 小红书 MCP 服务反向代理配置
#
# 部署路径: /etc/nginx/conf.d/mcp.yunwan.me.conf

# 速率限制配置
limit_req_zone $binary_remote_addr zone=yunwan_mcp_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=yunwan_api_limit:10m rate=20r/s;

# HTTP 服务器 - 重定向到 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name mcp.yunwan.me;


    # 重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 服务器
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mcp.yunwan.me;

    # SSL 证书路径（由自动化工具管理）
    ssl_certificate /etc/letsencrypt/live/yunwan.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yunwan.me/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/yunwan.me/chain.pem;

    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全头
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # 日志
    access_log /var/log/nginx/mcp-yunwan-access.log;
    error_log /var/log/nginx/mcp-yunwan-error.log;

    # 请求限制
    client_max_body_size 100M;
    client_body_timeout 120s;
    client_header_timeout 60s;

    # 根路径
    location = / {
        return 200 "xiaohongshu-mcp Gateway\nService: mcp.yunwan.me\n";
        add_header Content-Type text/plain;
    }

    # 健康检查（公开访问）
    location = /health {
        proxy_pass http://127.0.0.1:18060/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # MCP 端点（需要认证）
    location /mcp {
        # Basic Authentication
        auth_basic "MCP Access";
        auth_basic_user_file /etc/nginx/.htpasswd-yunwan;

        # 速率限制
        limit_req zone=yunwan_mcp_limit burst=20 nodelay;

        # 反向代理
        proxy_pass http://127.0.0.1:18060/mcp;
        proxy_http_version 1.1;

        # 代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket/SSE 支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时配置（长连接）
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # 禁用缓冲（SSE 流式传输）
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;

        # CORS
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

        # OPTIONS 预检
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Length 0;
            return 204;
        }
    }

    # API 端点（需要认证）
    location /api/ {
        # Basic Authentication
        auth_basic "API Access";
        auth_basic_user_file /etc/nginx/.htpasswd-yunwan;

        # 速率限制
        limit_req zone=yunwan_api_limit burst=40 nodelay;

        # 反向代理
        proxy_pass http://127.0.0.1:18060/api/;
        proxy_http_version 1.1;

        # 代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时配置
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # CORS
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

        # OPTIONS 预检
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Length 0;
            return 204;
        }
    }
}

# ============================================================
# 快速部署 (使用 /etc/nginx/conf.d 目录)
# ============================================================
#
# 1. 配置 DNS（在域名服务商处添加 A 记录）：
#    mcp.yunwan.me  →  你的服务器 IP
#
# 2. 创建认证文件：
#    sudo htpasswd -c -m /etc/nginx/.htpasswd-yunwan admin
#    sudo chmod 640 /etc/nginx/.htpasswd-yunwan
#    sudo chown root:nginx /etc/nginx/.htpasswd-yunwan
#
# 3. 复制配置文件到 conf.d 目录：
#    sudo cp nginx-yunwan.me.conf /etc/nginx/conf.d/mcp.yunwan.me.conf
#
# 4. 测试并重新加载：
#    sudo nginx -t
#    sudo systemctl reload nginx
#
# 5. 测试访问：
#    curl https://mcp.yunwan.me/health
#    curl -u admin:password https://mcp.yunwan.me/mcp
#
# 注意事项：
# - conf.d 目录下的配置文件会被自动加载（无需创建软链接）
# - 配置文件必须以 .conf 结尾
# - 确保 nginx.conf 中包含 "include /etc/nginx/conf.d/*.conf;"
#
